<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Ninjas STEM Night Tutorials</title>
    <link rel="icon" type="image/png" href="images/shortIcon.png">
    <link type="text/css" href="styles.css" rel="stylesheet">
</head>
<body>
    <header>
        <p><img src="images/CodeNinjasLogoHorizontal_White.svg" alt="Code Ninjas Logo"></p>
        <h2>STEM Night Tutorials</h2>
        <p class="tagline">Pick your game!</p>
    </header>
    <main>
        <a class="game short" href="https://arcade.makecode.com/#tutorial:github:derickson73/STEM-Nights/Simple" target="_blank">
            <img src="images/shortIcon.png" alt="Short Tutorial">
            <span class="name">Make Me Move</span>
            <span class="steps">5 Steps</span>
        </a>
        <a class="game long" href="https://arcade.makecode.com/#tutorial:/tutorials/collect-the-clovers" target="_blank">
            <img src="images/longIcon.png" alt="Long Tutorial">
            <span class="name">Collect the Clovers</span>
            <span class="steps">23 Steps</span>
        </a>
    </main>
</body>
</html>
