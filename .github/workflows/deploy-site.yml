# Uploads the site/ folder to duaneerickson.com (GoDaddy) over FTPS
# whenever something in site/ changes on main.
#
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions,
# add these repository secrets:
#   FTP_SERVER    e.g. ftp.duaneerickson.com
#   FTP_USERNAME  the cPanel FTP account (e.g. deploy@duaneerickson.com)
#   FTP_PASSWORD  that account's password
#
# Only files inside site/ are ever uploaded. Files on the server that
# aren't in site/ (like .htaccess) are left alone.

name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site/ to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./
